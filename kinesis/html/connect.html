<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hora de Bailar · Conectar</title>

    <link rel="stylesheet" href="../css/styles.css?v=11">
    <link rel="stylesheet" href="../css/connect.css?v=8">
</head>


<body data-pantalla="connect">


    <video id="fondo-global" class="fondo-global" autoplay loop muted playsinline preload="auto">
        <source src="../img/fondo-4K.webm" type="video/webm">
    </video>


    <div id="connect" class="connect screen active">
        <div class="connect-content">
            <h1 class="">CONECTAR</h1>
            <p class="">Haz clic en cualquier lugar para conectar la plataforma</p>
        </div>
    </div>


    <svg width="0" height="0" aria-hidden="true" focusable="false"
         style="position:absolute; pointer-events:none; opacity:0">
        <defs>
            <filter id="liquid-glass-filter" x="0" y="0" width="100%" height="100%"
                    color-interpolation-filters="sRGB">
                <feTurbulence type="fractalNoise" baseFrequency="0.008 0.012"
                              numOctaves="1" seed="7" result="ruido" />
                <feGaussianBlur in="ruido" stdDeviation="1" result="ruidoSuave" />
                <feDisplacementMap in="SourceGraphic" in2="ruidoSuave"
                                   scale="20" xChannelSelector="R" yChannelSelector="G" />
            </filter>

            <filter id="liquid-glass-strong" x="0" y="0" width="100%" height="100%"
                    color-interpolation-filters="sRGB">
                <feTurbulence type="fractalNoise" baseFrequency="0.006 0.010"
                              numOctaves="1" seed="19" result="ruido" />
                <feGaussianBlur in="ruido" stdDeviation="1.2" result="ruidoSuave" />
                <feDisplacementMap in="SourceGraphic" in2="ruidoSuave"
                                   scale="34" xChannelSelector="R" yChannelSelector="G" />
            </filter>
        </defs>
    </svg>

    <div id="game-debugger" style="display: none;
         position: fixed; top: 20px; right: 20px; background-color: rgba(20, 20, 20, 0.95); color: white; border: 2px solid #ffcc00; border-radius: 10px; padding: 15px; z-index: 100000; font-family: monospace; flex-direction: column; gap: 8px; box-shadow: 0px 10px 25px rgba(0,0,0,0.5); width: 180px;"></div>



    <script src="../js/state.js?v=11"></script>
    <script src="../js/sesion.js?v=8"></script>
    <script src="../js/navegacion.js?v=8"></script>
    <script src="../js/audio.js?v=8"></script>
    <script src="../js/debugger.js?v=15"></script>
    <script src="../js/entrada.js?v=10"></script>
    <script src="../js/precarga.js?v=1"></script>
    <script src="../js/pantalla-conectar.js?v=9"></script>
    <script src="../js/inicio.js?v=8"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            iniciarPagina();
            permitirAutoplay();
            iniciarPrecarga();
            document.getElementById('connect').addEventListener('click', solicitarArduino);

            window.entrada_UP = () => irAPantalla('screen-cta');
        });
    </script>

</body>
</html>
