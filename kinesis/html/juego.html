<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hora de Bailar · A bailar</title>

    <link rel="stylesheet" href="../css/styles.css?v=11">
    <link rel="stylesheet" href="../css/juego.css?v=21">
</head>

<body data-pantalla="screen-game">

    <video id="fondo-global" class="fondo-global" autoplay loop muted playsinline preload="auto">
        <source src="../img/fondo-4K.webm" type="video/webm">
    </video>


    <div id="screen-game" class="screen game bg-game-layout active">
        <div id="ui-controls" style="display:none;">
            <button id="connectBtn">Conectar Arduino</button>
            <button id="playBtn">Jugar</button>
            <div id="status">Arduino no conectado</div>
        </div>

        <header>

            <div class="game-badge">
                <h1 id="dance-title-game">Hora de Bailar</h1>
            </div>
        </header>

        <div class="main-game">
            <div class="grid-container" id="grid">
                <div class="grid-item" id="zero"></div>
                <div class="grid-item" id="target-UP"><img src="../img/arrow-up.svg" alt="Arriba"></div>
                <div class="grid-item" id="zero"></div>
                <div class="grid-item" id="target-LEFT"><img src="../img/arrow-left.svg" alt="Izquierda"></div>
                <div class="grid-item" id="centro"> <img src="../img/glass-circle.svg" alt=""></div>
                <div class="grid-item" id="target-RIGHT"><img src="../img/arrow-right.svg" alt="Derecha"></div>
                <div class="grid-item" id="zero"></div>
                <div class="grid-item" id="target-DOWN"><img src="../img/arrow-down.svg" alt="Abajo"></div>
                <div class="grid-item" id="zero"></div>
            </div>
        </div>


        <div id="hit-feedback" class="hit-feedback" aria-live="polite"></div>


        <div class="hud-bottom">
            <div id="combo-banner" class="combo-banner activo" aria-live="polite">
                <span class="pasos-cap">Pasos</span>
                <span class="pasos-num" id="pasos-num">0</span>
                <span class="pasos-sub">acertados</span>
                <div class="combo-sep" aria-hidden="true"></div>
                <div class="combo-fila">
                    <span class="combo-num" id="combo-num">0</span>
                    <span class="combo-lbl">seguidos</span>
                </div>
                <div class="combo-x" id="combo-x"></div>
            </div>


            <div id="score-display" class="">
                <span class="score-cap">Puntos</span>
                <span class="score-num" id="score-value">0</span>
                <span class="score-combo" id="score-combo"></span>
            </div>
        </div>
    </div>


    <svg width="0" height="0" aria-hidden="true" focusable="false"
         style="position:absolute; pointer-events:none; opacity:0">
        <defs>
            <filter id="liquid-glass-filter" x="0" y="0" width="100%" height="100%"
                    color-interpolation-filters="sRGB">
                <feTurbulence type="fractalNoise" baseFrequency="0.008 0.012"
                              numOctaves="1" seed="7" result="ruido" />
                <feGaussianBlur in="ruido" stdDeviation="1" result="ruidoSuave" />
                <feDisplacementMap in="SourceGraphic" in2="ruidoSuave"
                                   scale="20" xChannelSelector="R" yChannelSelector="G" />
            </filter>

            <filter id="liquid-glass-strong" x="0" y="0" width="100%" height="100%"
                    color-interpolation-filters="sRGB">
                <feTurbulence type="fractalNoise" baseFrequency="0.006 0.010"
                              numOctaves="1" seed="19" result="ruido" />
                <feGaussianBlur in="ruido" stdDeviation="1.2" result="ruidoSuave" />
                <feDisplacementMap in="SourceGraphic" in2="ruidoSuave"
                                   scale="34" xChannelSelector="R" yChannelSelector="G" />
            </filter>
        </defs>
    </svg>

    <div id="game-debugger" style="display: none;
         position: fixed; top: 20px; right: 20px; background-color: rgba(20, 20, 20, 0.95); color: white; border: 2px solid #ffcc00; border-radius: 10px; padding: 15px; z-index: 100000; font-family: monospace; flex-direction: column; gap: 8px; box-shadow: 0px 10px 25px rgba(0,0,0,0.5); width: 180px;"></div>


    <script src="../js/state.js?v=11"></script>
    <script src="../js/sesion.js?v=8"></script>
    <script src="../js/navegacion.js?v=8"></script>
    <script src="../js/audio.js?v=8"></script>
    <script src="../js/debugger.js?v=15"></script>
    <script src="../js/entrada.js?v=10"></script>
    <script src="../js/pantalla-juego.js?v=13"></script>
    <script src="../js/inicio.js?v=8"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            iniciarPagina();
            permitirAutoplay();

            state.grid      = document.getElementById("grid");
            state.scoreText = document.getElementById("score-display");
            state.statusText = document.getElementById("status");

            empezarJuego();

            reabrirPlacaSiHay();

            const responder = dir => recibirDireccion(dir);
            window.entrada_UP    = () => responder('UP');
            window.entrada_DOWN  = () => responder('DOWN');
            window.entrada_LEFT  = () => responder('LEFT');
            window.entrada_RIGHT = () => responder('RIGHT');
        });
    </script>

</body>
</html>
