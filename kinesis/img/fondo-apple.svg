<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" preserveAspectRatio="xMidYMid slice">
  <!-- Fondo azul profundo estilo Apple -->
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#0b1a3a"/>
      <stop offset="45%"  stop-color="#132a52"/>
      <stop offset="100%" stop-color="#0a1428"/>
    </linearGradient>

    <!-- Aureolas suaves de color -->
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#2f6fe4" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#2f6fe4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#7b5cf0" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#7b5cf0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow3" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#31b0e8" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#31b0e8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow4" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#e04fa0" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#e04fa0" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="50%"  stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.10"/>
    </linearGradient>

    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="90"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#base)"/>

  <!-- Manchas de color, muy difuminadas -->
  <g filter="url(#soft)">
    <ellipse cx="300"  cy="180" rx="520" ry="380" fill="url(#glow1)"/>
    <ellipse cx="1330" cy="250" rx="480" ry="360" fill="url(#glow2)"/>
    <ellipse cx="820"  cy="820" rx="620" ry="380" fill="url(#glow3)"/>
    <ellipse cx="1180" cy="700" rx="380" ry="300" fill="url(#glow4)"/>
    <ellipse cx="180"  cy="760" rx="420" ry="320" fill="url(#glow3)"/>
  </g>

  <!-- Brillo diagonal muy tenue, da profundidad -->
  <rect width="1600" height="900" fill="url(#sheen)"/>

  <!-- Viñeta para que el centro quede despejado */
  <radialGradient id="vignette" cx="50%" cy="46%" r="72%">
    <stop offset="55%"  stop-color="#000000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0.45"/>
  </radialGradient>
  <rect width="1600" height="900" fill="url(#vignette)"/>
</svg>