<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
    <!-- Avatar por defecto.
         El <img> de la tarjeta de score pedia img/avatar.png, que no esta
         en el repo: salia el icono de imagen rota dentro del circulo.
         Esto es un sustituto minimo (una silueta) para que se vea limpio.
         Si mas adelante se anade img/avatar.png de verdad, hay que apuntar
         el <img> de html/score.html a ese fichero. -->
    <defs>
        <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%"  stop-color="#9fe4ff"/>
            <stop offset="100%" stop-color="#4c9fd0"/>
        </linearGradient>
    </defs>

    <rect width="96" height="96" fill="url(#fondo)"/>

    <circle cx="48" cy="38" r="16" fill="#ffffff" opacity="0.95"/>
    <path d="M48 60c-16 0-29 10-31 23v13h62V83c-2-13-15-23-31-23z"
          fill="#ffffff" opacity="0.95"/>
</svg>